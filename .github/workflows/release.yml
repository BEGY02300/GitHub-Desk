name: Builds multiplateformes

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Détermination de la version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith("refs/tags/")
              ? context.ref.slice("refs/tags/".length)
              : null;
            const version = tag ?? `v1.0.${context.runNumber}`;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Tag de version invalide : ${version}`);
            }
            core.setOutput("value", version);

      - name: Préparation des bibliothèques Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 python3-gi python3-gi-cairo

      - name: Configuration de Python
        if: matrix.platform != 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Préparation de l'environnement Linux
        if: matrix.platform == 'linux'
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Préparation de l'environnement Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m venv .venv
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Préparation de l'environnement macOS
        if: matrix.platform == 'macos'
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Installation des dépendances de build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Construction et vérification des paquets
        env:
          GITHUB_DESK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python -m unittest discover -s tests -q
          python tools/package.py

      - name: Publication des fichiers du build
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publication de la version
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Détermination de la version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith("refs/tags/")
              ? context.ref.slice("refs/tags/".length)
              : null;
            const version = tag ?? `v1.0.${context.runNumber}`;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Tag de version invalide : ${version}`);
            }
            core.setOutput("value", version);

      - name: Récupération des paquets
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true

      - name: Création de la version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/* --clobber
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes release/*
          fi
