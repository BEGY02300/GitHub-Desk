name: Site GitHub Desk

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Vérification du site à publier
        shell: bash
        run: |
          test -s docs/index.html
          test -s docs/installation.html
          test -s docs/style.css
          test -s docs/assets/github-desk.svg
          test -s docs/assets/app-preview.svg
      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparation du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publication du site
        id: deployment
        uses: actions/deploy-pages@v4
