<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Aperçu illustratif de GitHub Desk</title>
  <desc id="description">Maquette sombre d'une application de gestion de dépôts avec navigation, cartes de statistiques et dépôts de démonstration fictifs.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2942"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#668cff"/>
      <stop offset="1" stop-color="#4dd7c8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020611" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="678" rx="26" fill="url(#frame)" stroke="#344762" stroke-width="2"/>
