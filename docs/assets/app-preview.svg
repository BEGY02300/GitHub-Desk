    <text x="72" y="421" fill="#aab8cf" font-family="Segoe UI,Arial,sans-serif" font-size="15">Issues</text>
    <text x="72" y="470" fill="#aab8cf" font-family="Segoe UI,Arial,sans-serif" font-size="15">GitHub Actions</text>
    <rect x="56" y="562" width="188" height="58" rx="11" fill="#111e30" stroke="#283951"/>
    <circle cx="74" cy="584" r="5" fill="#54dece"/>
