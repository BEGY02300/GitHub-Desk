    <circle cx="122" cy="68" r="8" fill="#63dfb2"/>
    <text x="600" y="74" text-anchor="middle" fill="#a9b8cf" font-family="Segoe UI,Arial,sans-serif" font-size="17">GitHub Desk · aperçu illustratif</text>

    <rect x="38" y="100" width="224" height="546" fill="#0e1728"/>
    <path d="M262 100v546" stroke="#273650" stroke-width="2"/>
    <rect x="61" y="123" width="40" height="40" rx="12" fill="url(#accent)"/>
    <path d="M74 139v13m0-7h14m0-7v14" fill="none" stroke="#102039" stroke-linecap="round" stroke-width="3"/>
    <circle cx="74" cy="138" r="3" fill="#102039"/>
    <circle cx="74" cy="152" r="3" fill="#102039"/>
    <circle cx="89" cy="138" r="3" fill="#102039"/>
    <circle cx="89" cy="152" r="3" fill="#102039"/>
    <text x="112" y="140" fill="#edf3ff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">GitHub Desk</text>
    <text x="112" y="158" fill="#91a0b9" font-family="Segoe UI,Arial,sans-serif" font-size="12">ton compte, simplement</text>

    <rect x="53" y="193" width="194" height="42" rx="10" fill="#1a2a43"/>
    <rect x="53" y="193" width="4" height="42" rx="2" fill="#76a3ff"/>
