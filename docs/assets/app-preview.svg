      <text x="322" y="292" fill="#edf3ff" font-size="32" font-weight="700">32</text>
      <text x="372" y="291" fill="#54dece" font-size="12">+2 récemment</text>

      <rect x="570" y="219" width="250" height="112" rx="14" fill="#131f33" stroke="#2b3c58"/>
      <text x="590" y="249" fill="#91a0b9" font-size="13">Dépôts privés</text>
      <text x="590" y="292" fill="#edf3ff" font-size="32" font-weight="700">18</text>
      <text x="640" y="291" fill="#91a0b9" font-size="12">sur ton compte</text>

      <rect x="838" y="219" width="292" height="112" rx="14" fill="#131f33" stroke="#2b3c58"/>
      <text x="858" y="249" fill="#91a0b9" font-size="13">Étoiles reçues</text>
      <text x="858" y="292" fill="#edf3ff" font-size="32" font-weight="700">146</text>
      <text x="920" y="291" fill="#91a0b9" font-size="12">tous dépôts confondus</text>

      <rect x="302" y="353" width="828" height="264" rx="14" fill="#101a2b" stroke="#2b3c58"/>
      <text x="324" y="388" fill="#edf3ff" font-size="17" font-weight="700">Dépôts récents</text>
      <text x="324" y="427" fill="#8496b3" font-size="11" font-weight="700" letter-spacing="1">NOM</text>
      <text x="810" y="427" fill="#8496b3" font-size="11" font-weight="700" letter-spacing="1">LANGAGE</text>
      <text x="982" y="427" fill="#8496b3" font-size="11" font-weight="700" letter-spacing="1">ÉTAT</text>
      <path d="M320 440h792M320 493h792M320 546h792M320 599h792" stroke="#26354e"/>

      <circle cx="337" cy="467" r="5" fill="#76a3ff"/>
      <text x="353" y="472" fill="#dfe9fa" font-size="14" font-weight="600">mon-projet-web</text>
      <text x="810" y="472" fill="#9eacc2" font-size="13">TypeScript</text>
      <rect x="982" y="453" width="112" height="26" rx="13" fill="#15372e"/>
      <text x="1038" y="470" text-anchor="middle" fill="#73e0b0" font-size="11">Synchronisé</text>

      <circle cx="337" cy="520" r="5" fill="#ffd075"/>
      <text x="353" y="525" fill="#dfe9fa" font-size="14" font-weight="600">outil-python</text>
      <text x="810" y="525" fill="#9eacc2" font-size="13">Python</text>
      <rect x="982" y="506" width="112" height="26" rx="13" fill="#202b4b"/>
      <text x="1038" y="523" text-anchor="middle" fill="#aabaff" font-size="11">Privé</text>

      <circle cx="337" cy="573" r="5" fill="#54dece"/>
      <text x="353" y="578" fill="#dfe9fa" font-size="14" font-weight="600">portfolio</text>
      <text x="810" y="578" fill="#9eacc2" font-size="13">HTML</text>
      <rect x="982" y="559" width="112" height="26" rx="13" fill="#202b4b"/>
      <text x="1038" y="576" text-anchor="middle" fill="#aabaff" font-size="11">Public</text>
    </g>
  </g>
  <text x="600" y="662" text-anchor="middle" fill="#71829c" font-family="Segoe UI,Arial,sans-serif" font-size="12">Illustration de démonstration — données fictives</text>
